<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer Details - Car Dealers App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #2c3e50; }
        .navbar-brand, .nav-link { color: white !important; }
        .dealer-detail { background: white; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 30px; margin-bottom: 30px; }
        .review-card { background: #f8f9fa; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .review-card .sentiment { font-weight: bold; }
        .sentiment-positive { color: green; }
        .sentiment-negative { color: red; }
        .sentiment-neutral { color: gray; }
        .footer { background-color: #2c3e50; color: white; padding: 40px 0; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">Car Dealers App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about/">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact/">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="dealer-detail" id="dealerDetail">
            <h2>Loading dealer details...</h2>
        </div>

        <h3 class="mb-4">Reviews</h3>
        <div id="reviewsList"></div>
    </div>

    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2026 Car Dealers App. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const dealerId = '{{ dealer_id }}';

        async function loadDealer() {
            try {
                const response = await fetch(`/fetchDealer/${dealerId}`);
                const dealer = await response.json();
                document.getElementById('dealerDetail').innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <img src="https://via.placeholder.com/400x300?text=Dealer" class="img-fluid rounded" alt="${dealer.full_name}">
                        </div>
                        <div class="col-md-6">
                            <h2>${dealer.full_name}</h2>
                            <p class="lead">${dealer.description || 'No description available'}</p>
                            <hr>
                            <p><strong>ID:</strong> ${dealer.id}</p>
                            <p><strong>Address:</strong> ${dealer.address}</p>
                            <p><strong>City:</strong> ${dealer.city}, ${dealer.state} ${dealer.zip}</p>
                            <p><strong>Phone:</strong> ${dealer.phone}</p>
                            <p><strong>Lat:</strong> ${dealer.lat}, <strong>Long:</strong> ${dealer.long}</p>
                        </div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('dealerDetail').innerHTML = '<h2>Dealer not found</h2>';
            }
        }

        async function loadReviews() {
            try {
                const response = await fetch(`/fetchReviews/dealer/${dealerId}`);
                const reviews = await response.json();
                const container = document.getElementById('reviewsList');
                
                if (reviews.length === 0) {
                    container.innerHTML = '<p>No reviews yet.</p>';
                    return;
                }

                reviews.forEach(review => {
                    let sentimentImage = '/static/neutral.svg';
                    if (review.sentiment === 'positive') sentimentImage = '/static/positive.svg';
                    else if (review.sentiment === 'negative') sentimentImage = '/static/negative.svg';
                    
                    container.innerHTML += `
                        <div class="review-card">
                            <div class="d-flex justify-content-between">
                                <h5>${review.name}</h5>
                                <span class="sentiment sentiment-${review.sentiment}"><img src="${sentimentImage}" width="20" height="20"> ${review.sentiment}</span>
                            </div>
                            <p>${review.review}</p>
                            <p><strong>Purchase:</strong> ${review.purchase || 'N/A'} | <strong>Date:</strong> ${review.purchase_date || 'N/A'} | <strong>Car:</strong> ${review.car_make || 'N/A'} ${review.car_model || 'N/A'} ${review.car_year || ''}</p>
                            <small class="text-muted">By: ${review.user}</small>
                        </div>
                    `;
                });
            } catch (error) {
                document.getElementById('reviewsList').innerHTML = '<p>Error loading reviews.</p>';
            }
        }

        loadDealer();
        loadReviews();
    </script>
</body>
</html>
