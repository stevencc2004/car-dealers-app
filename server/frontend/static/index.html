<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Dealers App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #2c3e50; }
        .navbar-brand, .nav-link { color: white !important; }
        .hero-section { background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%); color: white; padding: 100px 0; }
        .dealer-card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.3s; }
        .dealer-card:hover { transform: translateY(-5px); }
        .footer { background-color: #2c3e50; color: white; padding: 40px 0; }
        .filter-section { background-color: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">Car Dealers App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about/">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact/">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login/">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="/register/">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero-section">
        <div class="container text-center">
            <h1>Find the Best Car Dealers</h1>
            <p class="lead">Discover trusted dealerships and read reviews from real customers</p>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div class="filter-section">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <h4>Filter Dealers by State</h4>
                    </div>
                    <div class="col-md-4">
                        <select class="form-select" id="stateFilter">
                            <option value="">All States</option>
                            <option value="Kansas">Kansas</option>
                            <option value="California">California</option>
                            <option value="New York">New York</option>
                            <option value="Texas">Texas</option>
                            <option value="Florida">Florida</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" onclick="filterDealers()">Filter</button>
                    </div>
                </div>
            </div>

            <div class="row" id="dealersList">
                <!-- Dealers will be loaded here -->
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2026 Car Dealers App. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadDealers(state = '') {
            const url = state ? `/api/dealers/state/${state}/` : '/api/dealers/';
            try {
                const response = await fetch(url);
                const dealers = await response.json();
                const container = document.getElementById('dealersList');
                container.innerHTML = '';
                
                if (dealers.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center"><p>No dealers found.</p></div>';
                    return;
                }
                
                dealers.forEach(dealer => {
                    container.innerHTML += `
                        <div class="col-md-4 mb-4">
                            <div class="card dealer-card">
                                <img src="${dealer.image_url || 'https://via.placeholder.com/300x200?text=Dealer'}" class="card-img-top" alt="${dealer.name}">
                                <div class="card-body">
                                    <h5 class="card-title">${dealer.name}</h5>
                                    <p class="card-text">${dealer.description || 'No description available'}</p>
                                    <p class="text-muted">${dealer.city}, ${dealer.state}</p>
                                    <a href="/dealers/${dealer._id}/" class="btn btn-primary">View Details</a>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error loading dealers:', error);
            }
        }

        function filterDealers() {
            const state = document.getElementById('stateFilter').value;
            loadDealers(state);
        }

        // Load all dealers on page load
        loadDealers();
    </script>
</body>
</html>
