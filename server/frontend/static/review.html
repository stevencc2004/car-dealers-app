<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Review - Car Dealers App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f5f5; }
        .navbar { background-color: #2c3e50; }
        .navbar-brand, .nav-link { color: white !important; }
        .review-form { max-width: 600px; margin: 50px auto; background: white; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 30px; }
        .footer { background-color: #2c3e50; color: white; padding: 40px 0; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">Car Dealers App</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about/">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact/">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="review-form">
            <h3 class="text-center mb-4">Post a Review</h3>
            <p class="text-muted text-center" id="dealerName"></p>
            <form id="reviewForm">
                <input type="hidden" id="dealerId" value="{{ dealer_id }}">
                <div class="mb-3">
                    <label for="name" class="form-label">Your Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="purchase" class="form-label">Purchase Car</label>
                    <select class="form-control" id="purchase" name="purchase">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="purchase_date" class="form-label">Purchase Date</label>
                    <input type="date" class="form-control" id="purchase_date" name="purchase_date">
                </div>
                <div class="mb-3">
                    <label for="car_make" class="form-label">Car Make</label>
                    <input type="text" class="form-control" id="car_make" name="car_make" placeholder="e.g. Toyota">
                </div>
                <div class="mb-3">
                    <label for="car_model" class="form-label">Car Model</label>
                    <input type="text" class="form-control" id="car_model" name="car_model" placeholder="e.g. Camry">
                </div>
                <div class="mb-3">
                    <label for="car_year" class="form-label">Car Year</label>
                    <input type="number" class="form-control" id="car_year" name="car_year" min="1900" max="2030" placeholder="e.g. 2024">
                </div>
                <div class="mb-3">
                    <label for="review" class="form-label">Your Review</label>
                    <textarea class="form-control" id="review" name="review" rows="5" required></textarea>
                </div>
                <input type="hidden" id="user" value="{{ username }}">
                <button type="button" class="btn btn-primary w-100" onclick="submitReview()">Submit Review</button>
            </form>
            <div id="result" class="mt-3" style="display:none;"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2026 Car Dealers App. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const dealerId = '{{ dealer_id }}';
        const username = '{{ username }}';

        async function loadDealer() {
            try {
                const response = await fetch(`/fetchDealer/${dealerId}`);
                const dealer = await response.json();
                document.getElementById('dealerName').textContent = `Reviewing: ${dealer.full_name}`;
            } catch (error) {
                document.getElementById('dealerName').textContent = 'Dealer';
            }
        }

        async function submitReview() {
            const name = document.getElementById('name').value;
            const review = document.getElementById('review').value;
            const purchase = document.getElementById('purchase').value;
            const purchase_date = document.getElementById('purchase_date').value;
            const car_make = document.getElementById('car_make').value;
            const car_model = document.getElementById('car_model').value;
            const car_year = document.getElementById('car_year').value;

            if (!name || !review) {
                alert('Please fill in all fields');
                return;
            }

            try {
                const response = await fetch('/addReview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        dealer_id: dealerId,
                        name: name,
                        review: review,
                        purchase: purchase,
                        purchase_date: purchase_date,
                        car_make: car_make,
                        car_model: car_model,
                        car_year: car_year,
                        user: username || 'anonymous'
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    let sentimentImage = 'neutral.png';
                    if (data.sentiment === 'positive') sentimentImage = 'positive.png';
                    else if (data.sentiment === 'negative') sentimentImage = 'negative.png';
                    
                    document.getElementById('result').style.display = 'block';
                    document.getElementById('result').innerHTML = `
                        <div class="alert alert-success">
                            <strong>Review submitted successfully!</strong><br>
                            Name: ${data.name}<br>
                            Review: ${data.review}<br>
                            Sentiment: <img src="/static/${sentimentImage}" alt="${data.sentiment}" width="30" height="30"> ${data.sentiment}
                        </div>
                    `;
                } else {
                    alert('Error submitting review');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        loadDealer();
    </script>
</body>
</html>
